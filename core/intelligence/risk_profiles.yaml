  gpt-4o:
    provider: openai
    type: llm
    license: proprietary_commercial
    release_date: "2024-05-13"
    last_assessed: "2026-03-15"
    owasp_risks:
      LLM01_prompt_injection:
        rating: susceptible
        notes: "No built-in input filtering; relies on application-level controls"
      LLM02_sensitive_data:
        rating: moderate
        notes: "Training data scope undisclosed; PII possible in outputs"
      LLM03_supply_chain:
        rating: low
        notes: "Hosted API; no local model artifacts to tamper with"
      LLM05_output_handling:
        rating: susceptible
        notes: "Can generate executable code, SQL, shell commands without guardrails"
      LLM06_excessive_agency:
        rating: moderate
        notes: "Function calling support; tool use requires application-level constraints"
      LLM07_system_prompt:
        rating: susceptible
        notes: "System prompts extractable via known jailbreak techniques"
      LLM08_vector_embedding:
        rating: not_applicable
        notes: "Not an embedding model"
      LLM10_unbounded_consumption:
        rating: moderate
        notes: "No server-side token limits by default; must set max_tokens"
    risk_index: 34
    risk_grade: C
    mitigations:
      - "Implement input validation/sanitization before LLM calls"
      - "Never expose raw LLM output to SQL/shell/eval contexts"
      - "Use output filtering for PII before returning to user"
      - "Set max_tokens on all API calls to prevent unbounded generation"
    license_risk: "Proprietary API; usage governed by OpenAI Terms of Service. Data may be used for model improvement unless opted out via API settings."

