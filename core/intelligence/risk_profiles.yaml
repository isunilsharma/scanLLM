# ScanLLM Model Risk Intelligence Database
#
# Curated risk profiles for AI models. Each profile scores the model across
# the OWASP LLM Top 10 (2025) categories and six risk dimensions:
#
#   1. Prompt injection susceptibility  (25%)
#   2. Data privacy posture             (20%)
#   3. Supply chain integrity           (15%)
#   4. Output safety                    (15%)
#   5. License compliance risk          (15%)
#   6. Transparency & documentation     (10%)
#
# Ratings: susceptible | moderate | low | not_applicable
# Risk index: 0-100 (lower is better)
# Risk grade: A (0-20), B (21-40), C (41-60), D (61-80), F (81-100)
#
# Last full review: 2026-03-15
# Maintainer: ScanLLM Intelligence Team

schema_version: "1.0"

